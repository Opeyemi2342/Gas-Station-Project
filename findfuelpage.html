<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find fuel Page</title>
    <link rel="stylesheet" href="./dist/output.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" />
    
    <style>
        /* Eradicate card flickering/blinking on hover or click */
        #stations-grid > div {
            transform: none !important;
            transition: border-color 0.2s ease, box-shadow 0.2s ease !important;
        }
    </style>
</head>

<body>
    <div class="flex min-h-screen bg-[#F8F9FA] text-gray-800 font-sans relative overflow-x-hidden">
        
        <!-- SIDEBAR -->
        <aside id="sidebar"
            class="fixed inset-y-0 left-0 z-50 w-64 bg-white border-r border-gray-200 flex flex-col justify-between p-6 transform -translate-x-full lg:translate-x-0 lg:static transition-transform duration-300 ease-in-out shrink-0">
            <div>
                <div class="flex items-center space-x-2 text-emerald-900 font-bold text-lg">
                    <div class="flex items-center gap-3">
                        <div class="w-9 h-9 rounded-full bg-green-700 flex items-center justify-center">
                            <i class="fa-solid fa-bolt text-yellow-300"></i>
                        </div>

                        <span class="text-xl font-bold">
                            <span>Fuel</span><span class="text-green-700">less</span>
                        </span>
                    </div>
                </div>

                <div class="space-y-1">
                    <p class="text-[10px] font-bold text-gray-400 tracking-wider uppercase mb-3 mt-5">Menu</p>

                    <a href="./welcomepage.html"
                        class="flex items-center space-x-3 px-4 py-3 text-gray-500 hover:bg-gray-50 hover:text-gray-900 rounded-xl text-sm transition">
                        <i class="fa-solid fa-house text-base"></i>
                        <span>Overview</span>
                    </a>

                    <a href="./findfuelpage.html"
                        class="flex items-center space-x-3 px-4 py-3 bg-emerald-50 text-emerald-900 font-medium rounded-xl text-sm">
                        <i class="fa-solid fa-gas-pump text-base"></i>
                        <span>Find fuel</span>
                    </a>

                    <a href="./buyfuelpage.html"
                        class="flex items-center space-x-3 px-4 py-3 text-gray-500 hover:bg-gray-50 hover:text-gray-900 rounded-xl text-sm transition">
                        <i class="fa-solid fa-wallet text-base"></i>
                        <span>Buy fuel</span>
                    </a>

                    <a href="./mypurchase.html"
                        class="flex items-center space-x-3 px-4 py-3 text-gray-500 hover:bg-gray-50 hover:text-gray-900 rounded-xl text-sm transition">
                        <i class="fa-solid fa-receipt text-base"></i>
                        <span>My purchases</span>
                    </a>
                </div>
            </div>

            <div class="space-y-6">
                <div class="bg-emerald-950 text-white p-5 rounded-2xl relative overflow-hidden">
                    <div
                        class="w-7 h-7 bg-emerald-800/60 text-lime-400 rounded-lg flex items-center justify-center text-xs mb-3">
                        <i class="fa-solid fa-shield-halved"></i>
                    </div>
                    <h4 class="font-semibold text-sm mb-1">Need help?</h4>
                    <p class="text-xs text-emerald-200/80 mb-4">Our support team is online.</p>
                    <button
                        class="w-full bg-lime-400 text-emerald-950 font-semibold py-2.5 rounded-xl text-xs hover:bg-lime-300 transition">
                        Get support
                    </button>
                </div>

                <div class="flex items-center justify-between pt-2 border-t border-gray-100">
                    <div class="flex items-center space-x-3">
                        <div
                            class="w-9 h-9 bg-amber-200 text-amber-800 font-bold rounded-full flex items-center justify-center text-xs">
                            AO
                        </div>
                        <div>
                            <h5 class="text-xs font-semibold text-gray-900">Opeyemi Adegbesan</h5>
                            <p class="text-[10px] text-gray-400">adegbesanopeyemi55@gmail.com</p>
                        </div>
                    </div>
                    <button class="text-gray-400 hover:text-gray-600">
                        <i class="fa-solid fa-ellipsis-vertical"></i>
                    </button>
                </div>
            </div>
        </aside>

        <!-- MAIN CONTENT CONTAINER -->
        <main class="flex-1 p-4 md:p-8 overflow-y-auto w-full">
            <header class="mb-6 space-y-4">
                <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-2 text-emerald-900 font-bold text-lg">
                        <div class="flex items-center gap-3">
                            <div class="w-9 h-9 rounded-full bg-green-700 flex items-center justify-center">
                                <i class="fa-solid fa-bolt text-yellow-300"></i>
                            </div>

                            <span class="text-xl font-bold">
                                <span>Fuel</span><span class="text-green-700">less</span>
                            </span>
                        </div>
                    </div>

                    <div class="flex items-center space-x-2.5">
                        <!-- Notification Bell with Red Badge Counter -->
                        <button id="bell-btn"
                            class="relative w-10 h-10 bg-white border border-gray-200/80 rounded-full flex items-center justify-center text-gray-600 hover:bg-gray-50 shadow-sm active:scale-95 transition">
                            <i class="fa-regular fa-bell text-sm"></i>
                            <span id="notif-badge" class="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center shadow-md">3</span>
                        </button>

                        <!-- Mobile Menu Toggle Button -->
                        <button id="menu-btn"
                            class="lg:hidden w-10 h-10 bg-white border border-gray-200/80 rounded-xl flex items-center justify-center text-gray-700 shadow-sm hover:bg-gray-50 active:scale-95 transition">
                            <i class="fa-solid fa-bars text-base"></i>
                        </button>
                    </div>
                </div>

                <div class="pt-1">
                    <p class="text-[10px] font-semibold text-gray-400 uppercase tracking-wider mb-0.5">Welcome back, Opeyemi</p>
                    <h1 id="animated-heading" class="text-2xl font-bold text-gray-900 tracking-tight transition-all duration-500">
                        Find fuel near you
                    </h1>
                </div>
            </header>

            <!-- SEARCH BAR SECTION -->
            <div class="flex flex-col md:flex-row gap-3 mb-6">
                <div class="flex-1 relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
                    <!-- Real-time search input -->
                    <input type="text" id="search-input" placeholder="Search by area or station name (e.g. Nipco, Lekki)"
                        class="w-full bg-white border border-gray-200/80 rounded-2xl pl-11 pr-4 py-3.5 text-sm outline-none focus:border-emerald-700 shadow-sm placeholder:text-gray-400">
                </div>

                <!-- Location Request Button -->
                <button id="location-btn"
                    class="bg-emerald-50/70 border border-emerald-100 text-emerald-900 px-5 py-3.5 rounded-2xl text-xs font-semibold flex items-center justify-center space-x-2 hover:bg-emerald-100 transition shrink-0">
                    <i class="fa-solid fa-location-crosshairs text-emerald-700 text-sm"></i>
                    <span id="location-text">Use my location</span>
                </button>
            </div>

            <!-- FILTER CHIPS -->
            <div class="flex items-center space-x-2 overflow-x-auto pb-2 mb-8">
                <button class="filter-chip bg-emerald-900 text-white px-4 py-2 rounded-full text-xs font-medium shrink-0" data-filter="all">All stations</button>
                <button class="filter-chip bg-white text-gray-600 border border-gray-200/60 px-4 py-2 rounded-full text-xs font-medium shrink-0" data-filter="price">Lowest price</button>
                <button class="filter-chip bg-white text-gray-600 border border-gray-200/60 px-4 py-2 rounded-full text-xs font-medium shrink-0" data-filter="queue">Shortest queue</button>
                <button class="filter-chip bg-white text-gray-600 border border-gray-200/60 px-4 py-2 rounded-full text-xs font-medium shrink-0" data-filter="nearest">Nearest</button>
            </div>

            <div class="flex items-center justify-between mb-4">
                <div>
                    <h3 id="station-heading" class="text-base md:text-lg font-semibold text-gray-900">Stations around you</h3>
                    <p id="station-subheading" class="text-xs text-gray-400">Showing verified stations</p>
                </div>
                <span class="flex items-center text-[11px] font-medium text-gray-500">
                    <span class="w-2 h-2 bg-emerald-500 rounded-full mr-1.5"></span> Live availability
                </span>
            </div>

            <!-- STATION CARDS GRID (Populated dynamically by findfuelpage.js without layout flicker) -->
            <div id="stations-grid" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4 mb-8">
                <!-- Cards render smoothly here via JavaScript -->
            </div>

            <!-- MAP VIEW CONTAINER -->
            <div id="map-container" class="relative w-full h-48 bg-emerald-50/60 rounded-2xl border border-emerald-100 overflow-hidden flex items-center justify-center transition-all duration-500">
                
                <!-- Graphic Preview State -->
                <div id="map-preview-bg" class="absolute inset-0 flex items-center justify-center w-full h-full">
                    <div class="absolute inset-0 opacity-20 bg-[radial-gradient(#10b981_1px,transparent_1px)] [background-size:16px_16px]"></div>

                    <div class="absolute left-1/3 top-1/2 -translate-y-1/2 w-8 h-8 bg-emerald-950 text-white rounded-xl rounded-br-none flex items-center justify-center shadow-lg -rotate-45">
                        <i class="fa-solid fa-gas-pump text-xs rotate-45"></i>
                    </div>

                    <div class="absolute right-1/3 top-1/3 w-8 h-8 bg-emerald-950 text-white rounded-xl rounded-br-none flex items-center justify-center shadow-lg -rotate-45">
                        <i class="fa-solid fa-gas-pump text-xs rotate-45"></i>
                    </div>

                    <button id="open-map-btn" type="button" class="relative z-10 bg-emerald-950 text-white px-5 py-3 rounded-xl text-xs font-semibold flex items-center space-x-2 shadow-md hover:bg-emerald-900 transition">
                        <span>Open map view</span>
                        <i class="fa-solid fa-arrow-right text-[10px]"></i>
                    </button>
                </div>

                <!-- Live Embedded Interactive Map -->
                <div id="embedded-map" class="absolute inset-0 hidden w-full h-full">
                    <iframe id="map-iframe" width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="https://maps.google.com/maps?q=gas+station+Lagos&t=&z=14&ie=UTF8&iwloc=&output=embed"></iframe>
                </div>
            </div>

        </main>
    </div>

<script src="./Javascript Folders/findfuelpage.js"></script>
</body>

</html>
